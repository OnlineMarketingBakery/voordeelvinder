# Copy of the live Nginx vhost for voordeelvinder.onlinemarketingbakery.nl (staging), 2026-09-29.
# The live file is edited in Ploi (site -> Manage -> Edit NGINX configuration) or via the API.
# Keep this copy in sync; see docs/ops/ploi-staging.md and docs/decisions/0003-ploi-hosting.md.

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/voordeelvinder.onlinemarketingbakery.nl/before/*;

server {
    #listen 80;
    #listen [::]:80;

    server_name voordeelvinder.onlinemarketingbakery.nl;

    include /etc/nginx/ssl/voordeelvinder.onlinemarketingbakery.nl;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    charset utf-8;

    # Ploi Configuration, do not remove!
    include /etc/nginx/ploi/voordeelvinder.onlinemarketingbakery.nl/server/*;

    access_log off;
    error_log  /var/log/nginx/voordeelvinder.onlinemarketingbakery.nl-error.log error;

    # (1) removed the favicon.ico and robots.txt lines, so Astro serves them

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # (2) challenge files come from the folder certbot actually writes to
    location ~ /.well-known/acme-challenge {
        allow all;
        auth_basic off;
        root /home/voordeelvinder-9eyyh/voordeelvinder.onlinemarketingbakery.nl/public;
    }

    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;           # (4) real visitor IP
        proxy_set_header X-Forwarded-For $remote_addr;     # (4)
        proxy_set_header X-Forwarded-Proto $scheme;        # (5)
        proxy_cache_bypass $http_upgrade;
    }
}

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/voordeelvinder.onlinemarketingbakery.nl/after/*;
